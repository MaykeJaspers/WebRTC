<!DOCTYPE html>
<html>

<head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Controller</title>
    <link rel="stylesheet" href="/style.css" />
</head>

<body>
    <div class="controller-container">
        <h1>Controller</h1>

        <div class="status-box">
            <p>Session: <span id="session"></span></p>
            <p>Status: <span id="status">Connecting...</span></p>
        </div>

        <div class="controller-grid">
            <button id="up" class="btn direction">↑</button>

            <div class="middle-row">
                <button id="left" class="btn direction">←</button>
                <button id="shoot" class="btn action">●</button>
                <button id="right" class="btn direction">→</button>
            </div>

            <button id="down" class="btn direction">↓</button>
        </div>
    </div>

    <script src="/js/controller.js"></script>
</body>

</html>
